<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Fan — Watch</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="brand" href="index.html"><span>✦</span> Anime Fan</a><nav><a href="index.html">Home</a><a href="anime.html">Anime</a><a href="index.html#mylist">My List</a></nav></header><main class="container"><section class="section"><div class="panel" style="padding:0;overflow:hidden"><div style="aspect-ratio:16/9;background:#010207;display:grid;place-items:center"><div style="text-align:center;color:#8790a7"><div style="font-size:55px">▶</div><b style="color:#fff;font-size:20px">Video Player</b><p>Add your authorized video/embed URL here.</p></div></div><div style="padding:14px;display:flex;gap:8px;flex-wrap:wrap"><select><option>🇮🇳 Hindi Dub</option><option>🇬🇧 English Dub</option><option>🇯🇵 Original Audio</option></select><select><option>Season 01</option><option>Season 02</option></select></div></div><div class="hero-actions" style="margin-top:14px"><a class="btn ghost" id="prev">◀ Previous</a><a class="btn primary" id="next">Next Episode ▶</a></div><section class="section panel"><h2 id="watchTitle">Episode 1</h2><div class="genres" style="grid-template-columns:repeat(5,1fr)" id="eps"></div></section></section></main><script>const q=new URLSearchParams(location.search),id=q.get('anime')||'one-piece',ep=Number(q.get('episode')||1),max=20;watchTitle.textContent='Episode '+ep;prev.href='watch.html?anime='+id+'&episode='+Math.max(1,ep-1);next.href='watch.html?anime='+id+'&episode='+(ep+1);if(ep>=max){next.style.display='none';prev.className='btn primary'}eps.innerHTML=Array.from({length:20},(_,i)=>{let n=i+1;return `<a class="genre" href="watch.html?anime=${id}&episode=${n}" style="border-color:${n===ep?'#ff1744':''}">Episode ${n}</a>`}).join('');</script></body></html>
