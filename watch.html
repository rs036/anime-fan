<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Anime Fan</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div class="brand">✹ Anime <b>Fan</b></div>

  <nav>
    <a href="index.html">⌂ Home</a>
    <a href="anime.html">▣ Anime</a>
    <a href="movies.html">▤ Movies</a>
  </nav>

  <div class="top-actions">
    <input id="search" type="search" placeholder="Search anime...">
    ☰
  </div>
</header>

<main class="watch page">

  <div class="video" id="videoPlayer">
    <div class="video-placeholder">
      <div class="play-icon">▶</div>
      <h3>Loading...</h3>
      <p>Please wait...</p>
    </div>
  </div>

  <div class="watch-controls">

    <select id="languageSelect">
      <option>Loading...</option>
    </select>

    <select id="seasonSelect">
      <option>Season 01</option>
    </select>

    <span id="episodeLabel">Episode 1</span>

  </div>

  <div class="watch-nav">
    <button id="prev">◀ Previous</button>
    <button id="next" class="primary">Next ▶</button>
  </div>

  <h2>Episode List</h2>

  <div class="episodes" id="watchEpisodes"></div>

</main>

<script src="app.js"></script>

</body>
</html>
