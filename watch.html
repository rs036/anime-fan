<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Watch anime on Anime Fan">
  <title>Watch — Anime Fan</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="topbar">
    <div class="container topbar-in">
      <span>🇮🇳 Hindi Dub • English Dub • Original Audio</span>
      <span class="muted">Anime Fan Streaming</span>
    </div>
  </div>


  <header class="header">

    <div class="container nav">

      <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span>Anime <i>Fan</i></span>

      <nav aria-label="Main navigation">

        <a href="index.html">Home</a>

        <a href="anime.html">Anime</a>

        <a href="index.html#mylist">My List</a>

      </nav>


      <div class="nav-actions">

        <div class="search">

          <span>⌕</span>

          <input
            id="search"
            type="search"
            placeholder="Search anime..."
            autocomplete="off"
            aria-label="Search anime"
          >

        </div>


        <a
          class="admin-pill"
          href="admin.html"
        >
          Admin
        </a>


        <button
          class="menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

      </div>

    </div>

  </header>


  <!-- WATCH APP
       IMPORTANT:
       app.js renders the player inside this element.
  -->

  <main id="watchApp"></main>


  <footer>

    <div class="container footer-in">

      <div class="brand">
        ✦ Anime <i>Fan</i>

      ⌂

    </a>

      <small>Anime</small>

      <small>Genres</small>
    </a>
