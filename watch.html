<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Anime Fan</title>
  <meta name="description" content="Watch anime on Anime Fan">
  <link rel="stylesheet" href="styles.css">

  <style>
    .watch-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .watch-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050505;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .watch-player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .player-message {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #fff;
    }

    .player-message .play-icon {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e50914;
      font-size: 24px;
      margin-bottom: 14px;
    }

    .player-message h2 {
      margin: 0 0 8px;
    }

    .player-message p {
      margin: 0;
      color: #aaa;
    }

    .watch-info {
      margin-top: 16px;
    }

    .watch-title {
      margin: 0;
      font-size: 22px;
    }

    .watch-subtitle {
      margin: 6px 0 0;
      color: #999;
    }

    .watch-selectors {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .watch-selectors select {
      min-width: 170px;
      padding: 11px 13px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.12);
      background: #111;
      color: #fff;
      outline: none;
    }

    .watch-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    .watch-nav button {
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .watch-nav button.primary {
      background: #e50914;
    }

    .watch-nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .episode-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 28px;
      margin-bottom: 14px;
    }

    .episode-heading h2 {
      margin: 0;
    }

    .episode-count {
      color: #999;
      font-size: 14px;
    }

    .watch-episodes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 9px;
      padding-bottom: 30px;
    }

    .watch-episode {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 8px;
      border-radius: 8px;
      background: #151515;
      color: #ddd;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.06);
      transition: .2s;
    }

    .watch-episode:hover {
      border-color: #e50914;
    }

    .watch-episode.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
      font-weight: 700;
    }

    .watch-error {
      padding: 30px 15px;
      text-align: center;
      color: #fff;
    }

    .watch-error a {
      color: #fff;
      display: inline-block;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .watch-page {
        padding: 12px;
      }

      .watch-player {
        border-radius: 9px;
      }

      .watch-title {
        font-size: 18px;
      }

      .watch-selectors {
        display: grid;
        grid-template-columns: 1fr;
      }

      .watch-selectors select {
        width: 100%;
      }

      .watch-nav button {
        flex: 1;
        padding: 10px 8px;
      }

      .watch-episodes {
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }

      .watch-episode {
        min-height: 38px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      ✹ Anime <b>Fan</b>
    </div>

    <nav>
      <a href="index.html">⌂ Home</a>
      <a href="anime.html">▣ Anime</a>
      <a href="movies.html">▤ Movies</a>
    </nav>
  </header>

  <main class="watch-page">

    <div class="watch-player" id="videoPlayer">
      <div class="player-message">
        <div class="play-icon">▶</div>
        <h2>Loading...</h2>
        <p>Loading episode...</p>
      </div>
    </div>

    <div class="watch-info">
      <h1 class="watch-title" id="watchTitle">Loading...</h1>
      <p class="watch-subtitle" id="episodeLabel">Loading episode...</p>
    </div>

    <div class="watch-selectors">

      <select id="languageSelect" aria-label="Language">
      </select>

      <select id="seasonSelect" aria-label="Season">
      </select>

    </div>

    <div class="watch-nav">

      <button id="prev" type="button">
        ◀ Previous
      </button>

      <button id="next" class="primary" type="button">
        Next ▶
      </button>

    </div>

    <div class="episode-heading">
      <h2>Episodes</h2>
      <span class="episode-count" id="episodeCount"></span>
    </div>

    <div class="watch-episodes" id="watchEpisodes"></div>

  </main>

  <script src="app.js"></script>

</body>
</html>
