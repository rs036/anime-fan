<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Genre — AnimeFan</title>
<style>
:root{--bg:#0a0a0f;--card:#14141c;--elevated:#1a1a24;--border:rgba(255,255,255,0.08);--muted:#a1a1aa;--grad:linear-gradient(135deg,#a855f7,#ec4899);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh;}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:50;}
.logo{font-weight:800;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.page{padding:1.2rem 1.2%;max-width:1200px;margin:0 auto;}
.back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;display:inline-block;margin-bottom:1rem;}
.genre-head{display:flex;align-items:center;gap:0.85rem;margin-bottom:0.35rem;}
.genre-icon{width:52px;height:52px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.page-header h1{font-size:1.5rem;font-weight:800;}
.page-header p{color:var(--muted);font-size:0.9rem;}
.tabs{display:flex;gap:0.5rem;margin:1.1rem 0;flex-wrap:wrap;}
.tab{background:var(--elevated);border:1px solid var(--border);color:var(--muted);padding:0.45rem 1rem;border-radius:50px;font-size:0.85rem;cursor:pointer;font-family:inherit;}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;font-weight:600;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.85rem;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:0.55rem;}}
.anime-card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block;border:1px solid transparent;}
.anime-card:hover{border-color:rgba(168,85,247,0.4);transform:translateY(-3px);}
.card-poster{aspect-ratio:2/3;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;}
.rating-badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,0.7);color:#fbbf24;font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:4px;}
.card-body{padding:0.55rem;}
.card-body h3{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:0.7rem;color:var(--muted);}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.78rem;border-top:1px solid var(--border);margin-top:2rem;}

.pagination{display:flex;flex-wrap:wrap;gap:0.4rem;justify-content:center;align-items:center;margin:1.5rem 0 0.5rem;padding:0.5rem 0;}
.page-btn{
  min-width:36px;height:36px;padding:0 0.55rem;border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);
  color:#e4e4e7;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:inherit;
}
.page-btn:hover{border-color:rgba(168,85,247,0.5);color:#fff;}
.page-btn.active{background:linear-gradient(135deg,#a855f7,#ec4899);border-color:transparent;color:#fff;}
.page-btn:disabled{opacity:0.35;cursor:not-allowed;}
.empty-state{
  text-align:center;padding:3.5rem 1.5rem;color:#a1a1aa;
  background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.1);
  border-radius:16px;margin:1rem 0;
}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:0.75rem;opacity:0.7;}
.empty-state h3{color:#fff;font-size:1.15rem;margin-bottom:0.4rem;}
.empty-state p{font-size:0.9rem;}

</style></head><body>
<nav class="navbar"><a href="index.html" class="logo">AnimeFan</a></nav>
<div class="page">
  <a href="genres.html" class="back-btn">← All Genres</a>
  <div class="page-header">
    <div class="genre-head">
      <div class="genre-icon" id="gIcon">⚔️</div>
      <div><h1 id="gTitle">Action anime</h1><p id="gSub">0 titles available</p></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-sort="popular">Popular</button>
    <button class="tab" data-sort="newest">Newest</button>
    <button class="tab" data-sort="rated">Top Rated</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pager"></div>
</div>
<footer>
  <p style="font-size:0.72rem;margin-bottom:0.5rem;">AnimeFan does not store any files on our server, we only linked to the media which is hosted on 3rd party services.</p>
  <p>© 2026 AnimeFan. Made with ❤️ for anime lovers.</p>
</footer>
<script>
const icons={"Action":"⚔️","Romance":"💕","Comedy":"😂","Horror":"👻","Fantasy":"✨","Sci-Fi":"🚀","Mystery":"🔍","Drama":"🎭","Sports":"⚽","Mecha":"🤖","Adventure":"🗡️","Slice of Life":"🌿"};
const fullPool=[
  {t:"Shadow of the Eternal Blade",r:"9.4",e:"⚔️",m:"TV · 24 Eps"},
  {t:"Jujutsu Kaisen S3",r:"9.0",e:"🔥",m:"TV · 24 Eps"},
  {t:"Neon Horizon: Zero",r:"9.1",e:"🌌",m:"TV · 12 Eps"},
  {t:"Crimson Guild Chronicles",r:"9.2",e:"🗡️",m:"TV · 24 Eps"},
  {t:"Solo Leveling S2",r:"8.7",e:"🌀",m:"TV · 13 Eps"},
  {t:"One Punch Man S3",r:"8.8",e:"⚡",m:"TV · 12 Eps"},
  {t:"Demon Slayer S4",r:"9.0",e:"🌟",m:"TV · 11 Eps"},
  {t:"Attack on Titan",r:"9.5",e:"⚔️",m:"TV · 87 Eps"},
  {t:"Cherry Blossom Letters",r:"8.9",e:"💖",m:"TV · 12 Eps"},
  {t:"Spy x Family S3",r:"8.6",e:"🕵️",m:"TV · 12 Eps"},
  {t:"Frieren",r:"9.3",e:"🏰",m:"TV · 28 Eps"},
  {t:"Naruto Shippuden",r:"9.3",e:"🍥",m:"TV · 500 Eps"},
  {t:"Blue Lock S2",r:"8.4",e:"⚽",m:"TV · 12 Eps"},
  {t:"Kaiju No. 8",r:"8.7",e:"🦖",m:"TV · 12 Eps"},
  {t:"Chainsaw Man S2",r:"8.8",e:"🪚",m:"TV · 12 Eps"},
  {t:"Vinland Saga S3",r:"9.1",e:"🛡️",m:"TV · 24 Eps"},
  {t:"Mob Psycho 100",r:"8.9",e:"💫",m:"TV · 12 Eps"},
  {t:"Hunter x Hunter",r:"9.4",e:"🃏",m:"TV · 148 Eps"},
  {t:"Steins;Gate",r:"9.2",e:"⏳",m:"TV · 24 Eps"},
  {t:"Your Name",r:"9.0",e:"☄️",m:"Movie"},
  {t:"Death Note",r:"9.0",e:"📓",m:"TV · 37 Eps"},
  {t:"Tokyo Ghoul",r:"7.8",e:"👁",m:"TV · 12 Eps"},
  {t:"Haikyuu!!",r:"8.7",e:"🏐",m:"TV · 25 Eps"},
  {t:"Cowboy Bebop",r:"8.9",e:"🚀",m:"TV · 26 Eps"}
];
// empty genres for demo: Mecha, Horror partial
const emptyGenres=new Set(["Mecha"]);
const params=new URLSearchParams(location.search);
const g=params.get("g")||"Action";
document.getElementById("gTitle").textContent=g+" anime";
document.getElementById("gIcon").textContent=icons[g]||"🎬";
document.title=g+" — AnimeFan";

let list=[];
if(emptyGenres.has(g)) list=[];
else {
  list=fullPool.map((a,i)=>({...a,r:(parseFloat(a.r)- (i%5)*0.02).toFixed(1)}));
  // slightly different length per genre
  const n=8+((g.length*3)%16);
  list=list.slice(0,Math.min(n,list.length));
}
document.getElementById("gSub").textContent=list.length+" titles available";

const PER=12;
let page=1, sort="popular";

function sorted(){
  let arr=[...list];
  if(sort==="rated") arr.sort((a,b)=>parseFloat(b.r)-parseFloat(a.r));
  if(sort==="newest") arr=arr.slice().reverse();
  return arr;
}
function render(){
  const grid=document.getElementById("grid");
  const pager=document.getElementById("pager");
  const arr=sorted();
  if(!arr.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="es-icon">🎬</div><h3>No Anime Available</h3><p>Is genre mein abhi koi anime nahi hai. Baad mein check karo.</p></div>`;
    pager.innerHTML="";
    return;
  }
  const pages=Math.max(1,Math.ceil(arr.length/PER));
  if(page>pages) page=pages;
  const slice=arr.slice((page-1)*PER, page*PER);
  grid.innerHTML=slice.map(a=>`
    <a class="anime-card" href="anime-detail.html">
      <div class="card-poster"><span class="rating-badge">★ ${a.r}</span>${a.e}</div>
      <div class="card-body"><h3>${a.t}</h3><div class="card-meta">${a.m}</div></div>
    </a>`).join("");
  if(pages<=1){ pager.innerHTML=""; return; }
  let html=`<button class="page-btn" ${page===1?"disabled":""} data-p="${page-1}">‹</button>`;
  for(let i=1;i<=pages;i++){
    if(pages>7 && Math.abs(i-page)>2 && i!==1 && i!==pages){
      if(i===2 || i===pages-1) html+=`<span style="color:var(--muted);padding:0 0.2rem">…</span>`;
      continue;
    }
    html+=`<button class="page-btn ${i===page?"active":""}" data-p="${i}">${i}</button>`;
  }
  html+=`<button class="page-btn" ${page===pages?"disabled":""} data-p="${page+1}">›</button>`;
  pager.innerHTML=html;
  pager.querySelectorAll(".page-btn").forEach(b=>b.onclick=()=>{
    const p=parseInt(b.dataset.p,10); if(!p||p<1) return; page=p; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); sort=t.dataset.sort; page=1; render();
}));
render();
</script></body></html>
