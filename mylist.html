<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My List — AnimeFan</title><style>
:root{--bg:#0a0a0f;--card:#14141c;--elevated:#1a1a24;--border:rgba(255,255,255,0.08);--accent:#a855f7;--accent2:#ec4899;--muted:#a1a1aa;--grad:linear-gradient(135deg,#a855f7,#ec4899);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh;}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:50;}
.logo{font-weight:800;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.page{padding:1.5rem 1.2rem;max-width:440px;margin:0 auto;}
.page-wide{max-width:900px;}
.back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;display:inline-block;margin-bottom:1rem;}
.auth-card{
  background:radial-gradient(ellipse at top,rgba(168,85,247,0.12),transparent 60%),var(--card);
  border:1px solid rgba(168,85,247,0.25);border-radius:20px;padding:1.75rem 1.4rem;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.auth-card h1{font-size:1.45rem;font-weight:800;margin-bottom:0.35rem;}
.auth-card .sub{color:var(--muted);font-size:0.9rem;margin-bottom:1.4rem;}
.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:0.35rem;font-weight:600;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:0.8rem 1rem;border-radius:12px;border:1px solid var(--border);
  background:var(--elevated);color:#fff;font-family:inherit;font-size:0.95rem;
}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#a855f7;}
.btn-primary{width:100%;background:var(--grad);color:#fff;border:none;padding:0.9rem 1.4rem;border-radius:50px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.95rem;margin-top:0.35rem;}
.btn-primary:hover{opacity:0.93;}
.auth-foot{text-align:center;margin-top:1.2rem;font-size:0.88rem;color:var(--muted);}
.auth-foot a{color:#c4b5fd;text-decoration:none;font-weight:600;}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.78rem;border-top:1px solid var(--border);margin-top:2rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.85rem;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:0.55rem;}}
.anime-card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block;border:1px solid transparent;}
.anime-card:hover{border-color:rgba(168,85,247,0.4);}
.card-poster{aspect-ratio:2/3;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);display:flex;align-items:center;justify-content:center;font-size:2rem;}
.card-body{padding:0.55rem;}
.card-body h3{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:0.7rem;color:var(--muted);}
.req-premium{
  background:radial-gradient(ellipse at top left,rgba(168,85,247,0.22),transparent 55%),radial-gradient(ellipse at bottom right,rgba(236,72,153,0.15),transparent 50%),var(--card);
  border:1px solid rgba(168,85,247,0.3);border-radius:20px;padding:1.6rem 1.35rem;max-width:560px;
}
.req-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:0.65rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;}
.badge{font-size:0.72rem;font-weight:700;padding:0.25rem 0.6rem;border-radius:50px;}
.badge-pending{background:rgba(251,191,36,0.15);color:#fbbf24;}
.badge-approved{background:rgba(52,211,153,0.15);color:#34d399;}
.help-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:0.75rem;}
.help-card h3{font-size:0.95rem;margin-bottom:0.35rem;}
.help-card p{font-size:0.85rem;color:var(--muted);line-height:1.45;}
</style></head><body>
<nav class="navbar"><a href="index.html" class="logo">AnimeFan</a></nav>
<div class="page page-wide">
  <h1 style="font-size:1.4rem;margin-bottom:0.35rem;">♥ My List</h1>
  <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1.2rem;" id="sub">Your saved anime</p>
  <div class="grid" id="grid"></div>
</div>
<footer><p style="font-size:0.72rem;margin-bottom:0.5rem;">AnimeFan does not store any files on our server, we only linked to the media which is hosted on 3rd party services.</p><p>© 2026 AnimeFan. Made with ❤️ for anime lovers.</p></footer>
<script>
const u=JSON.parse(localStorage.getItem('animefan_user')||'null');
if(!u) location.href='login.html?next=mylist.html';
else document.getElementById('sub').textContent=(u.name||'You')+' · saved anime';
const list=[
  {t:'Shadow of the Eternal Blade',e:'⚔️',m:'TV · HSub'},
  {t:'Frieren',e:'🏰',m:'TV · HSub'},
  {t:'Jujutsu Kaisen S3',e:'🔥',m:'TV · HSub'}
];
document.getElementById('grid').innerHTML=list.map(a=>`
  <a class="anime-card" href="anime-detail.html">
    <div class="card-poster">${a.e}</div>
    <div class="card-body"><h3>${a.t}</h3><div class="card-meta">${a.m}</div></div>
  </a>`).join('');
</script></body></html>
