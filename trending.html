<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trending Now — AnimeFan</title>
<style>
:root{--bg:#0a0a0f;--card:#14141c;--border:rgba(255,255,255,0.08);--muted:#a1a1aa;--grad:linear-gradient(135deg,#a855f7,#ec4899);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:50}
.logo{font-weight:800;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.page{padding:1.2rem 1.2%;max-width:1200px;margin:0 auto}
h1{font-size:1.45rem;font-weight:800;margin-bottom:0.35rem}
.sub{color:var(--muted);font-size:0.9rem;margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.85rem}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:0.55rem}}
.anime-card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block;border:1px solid transparent}
.anime-card:hover{border-color:rgba(168,85,247,0.4);transform:translateY(-3px)}
.card-poster{aspect-ratio:2/3;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative}
.rating-badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,0.7);color:#fbbf24;font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:4px;font-weight:600}
.card-body{padding:0.55rem}
.card-body h3{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:0.7rem;color:var(--muted)}
.pagination{display:flex;flex-wrap:wrap;gap:0.45rem;justify-content:center;align-items:center;width:100%;margin:1.75rem auto 1rem}
.page-btn{min-width:40px;height:40px;padding:0 0.6rem;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#e4e4e7;font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.page-btn.active{background:var(--grad);border-color:transparent;color:#fff}
.page-btn:disabled{opacity:0.35;cursor:not-allowed}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.78rem;border-top:1px solid var(--border);margin-top:2rem}
</style></head><body>
<nav class="navbar"><a href="index.html" class="logo">AnimeFan</a></nav>
<div class="page">
  <h1>🔥 Trending Now</h1>
  <p class="sub">What’s hot on AnimeFan right now</p>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pager"></div>
</div>
<footer>
  <p style="font-size:0.72rem;margin-bottom:0.5rem;">AnimeFan does not store any files on our server, we only linked to the media which is hosted on 3rd party services.</p>
  <p>© 2026 AnimeFan. Made with ❤️ for anime lovers.</p>
</footer>
<script>
const list=[
  {t:"Shadow of the Eternal Blade",r:"9.4",e:"⚔️",m:"TV · 24 Eps · HSub"},
  {t:"Neon Horizon: Zero",r:"9.1",e:"🌌",m:"TV · 24 Eps · Hindi"},
  {t:"Cherry Blossom Letters",r:"8.9",e:"💖",m:"TV · 12 Eps · HSub"},
  {t:"Crimson Guild Chronicles",r:"9.2",e:"🗡️",m:"TV · 24 Eps · FanDub"},
  {t:"Jujutsu Kaisen S3",r:"9.0",e:"🔥",m:"TV · 24 Eps · HSub"},
  {t:"Solo Leveling S2",r:"8.7",e:"🌀",m:"TV · 13 Eps · Hindi"},
  {t:"One Punch Man S3",r:"8.8",e:"⚡",m:"TV · 12 Eps · HSub"},
  {t:"Spy x Family S3",r:"8.6",e:"🕵️",m:"TV · 12 Eps · Hindi"},
  {t:"Frieren",r:"9.3",e:"🏰",m:"TV · 28 Eps · HSub"},
  {t:"Demon Slayer S4",r:"9.0",e:"🌟",m:"TV · 11 Eps · FanDub"},
  {t:"Attack on Titan",r:"9.5",e:"⚔️",m:"TV · 87 Eps · HSub"},
  {t:"Naruto Shippuden",r:"9.3",e:"🍥",m:"TV · 500 Eps · Hindi"},
  {t:"One Piece",r:"9.2",e:"🏴‍☠️",m:"TV · 1100 Eps · Hindi"},
  {t:"Bleach TYBW",r:"9.0",e:"⚔️",m:"TV · 13 Eps · HSub"},
  {t:"Chainsaw Man S2",r:"8.8",e:"🪚",m:"TV · 12 Eps · HSub"},
  {t:"Kaiju No. 8",r:"8.7",e:"🦖",m:"TV · 12 Eps · FanDub"},
  {t:"Blue Lock S2",r:"8.4",e:"⚽",m:"TV · 12 Eps · FanDub"},
  {t:"Vinland Saga S3",r:"9.1",e:"🛡️",m:"TV · 24 Eps · HSub"},
  {t:"Mob Psycho 100",r:"8.9",e:"💫",m:"TV · 12 Eps · HSub"},
  {t:"Hunter x Hunter",r:"9.4",e:"🃏",m:"TV · 148 Eps · HSub"},
  {t:"Steins;Gate",r:"9.2",e:"⏳",m:"TV · 24 Eps · HSub"},
  {t:"Death Note",r:"9.0",e:"📓",m:"TV · 37 Eps · Hindi"},
  {t:"Your Name",r:"9.0",e:"☄️",m:"Movie · HSub"},
  {t:"Haikyuu!!",r:"8.7",e:"🏐",m:"TV · 25 Eps · HSub"},
  {t:"Tokyo Revengers",r:"8.1",e:"👊",m:"TV · 24 Eps · Hindi"},
  {t:"Black Clover",r:"8.3",e:"🍀",m:"TV · 170 Eps · Hindi"},
  {t:"Fairy Tail",r:"8.0",e:"🧚",m:"TV · 328 Eps · Hindi"},
  {t:"Boruto",r:"7.5",e:"🌀",m:"TV · 293 Eps · Hindi"},
  {t:"Cowboy Bebop",r:"8.9",e:"🚀",m:"TV · 26 Eps · HSub"},
  {t:"Dragon Ball Super",r:"8.5",e:"🐉",m:"TV · 131 Eps · Hindi"}
];
const PER=12; let page=1;
const grid=document.getElementById('grid'), pager=document.getElementById('pager');
function render(){
  const pages=Math.ceil(list.length/PER)||1;
  if(page>pages) page=pages;
  const slice=list.slice((page-1)*PER,page*PER);
  grid.innerHTML=slice.map(a=>`<a class="anime-card" href="anime-detail.html"><div class="card-poster"><span class="rating-badge">★ ${a.r}</span>${a.e}</div><div class="card-body"><h3>${a.t}</h3><div class="card-meta">${a.m}</div></div></a>`).join('');
  if(pages<=1){pager.innerHTML='';return;}
  let h=`<button type="button" class="page-btn" ${page===1?'disabled':''} data-p="${page-1}">‹</button>`;
  for(let i=1;i<=pages;i++) h+=`<button type="button" class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;
  h+=`<button type="button" class="page-btn" ${page===pages?'disabled':''} data-p="${page+1}">›</button>`;
  pager.innerHTML=h;
  pager.querySelectorAll('.page-btn').forEach(b=>b.onclick=()=>{const p=+b.dataset.p;if(p>=1&&p<=pages){page=p;render();window.scrollTo({top:0,behavior:'smooth'});}});
}
render();
</script>
</body></html>
