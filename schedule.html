<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Schedule — AnimeFan</title>
<style>

:root{--bg:#0a0a0f;--card:#14141c;--elevated:#1a1a24;--border:rgba(255,255,255,0.08);--accent:#a855f7;--accent2:#ec4899;--muted:#a1a1aa;--grad:linear-gradient(135deg,#a855f7,#ec4899);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh;}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:50;}
.logo{font-weight:800;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.nav-links{display:flex;gap:1.2rem;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;}
.nav-links a:hover,.nav-links a.active{color:#fff;}
@media(max-width:700px){.nav-links{display:none;}}
.page{padding:1.2rem 1.2%;max-width:1100px;margin:0 auto;}
.back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;display:inline-block;margin-bottom:1rem;}
.page-header{margin-bottom:1.3rem;}
.page-header h1{font-size:1.55rem;font-weight:800;margin-bottom:0.25rem;}
.page-header p{color:var(--muted);font-size:0.9rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.85rem;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:0.55rem;}}
.anime-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid transparent;cursor:pointer;transition:0.2s;text-decoration:none;color:inherit;display:block;}
.anime-card:hover{transform:translateY(-4px);border-color:rgba(168,85,247,0.4);}
.card-poster{width:100%;aspect-ratio:2/3;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);position:relative;display:flex;align-items:center;justify-content:center;font-size:2.2rem;}
.rating-badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,0.7);color:#fbbf24;font-size:0.7rem;font-weight:600;padding:0.15rem 0.4rem;border-radius:4px;}
.card-body{padding:0.55rem;}
.card-body h3{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.2rem;}
.card-meta{font-size:0.7rem;color:var(--muted);}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.78rem;border-top:1px solid var(--border);margin-top:2rem;}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem;max-width:560px;}
.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:0.82rem;color:var(--muted);margin-bottom:0.35rem;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:0.75rem 1rem;border-radius:10px;border:1px solid var(--border);
  background:var(--elevated);color:#fff;font-family:inherit;font-size:0.95rem;
}
.form-group textarea{min-height:90px;resize:vertical;}
.btn-primary{background:var(--grad);color:#fff;border:none;padding:0.8rem 1.4rem;border-radius:50px;font-weight:600;cursor:pointer;font-family:inherit;font-size:0.95rem;}
.btn-primary:hover{opacity:0.92;}
.req-list{margin-top:2rem;}
.req-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;margin-bottom:0.65rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;}
.req-item h4{font-size:0.95rem;margin-bottom:0.25rem;}
.req-item .meta{font-size:0.78rem;color:var(--muted);}
.badge{font-size:0.72rem;font-weight:700;padding:0.25rem 0.6rem;border-radius:50px;}
.badge-pending{background:rgba(251,191,36,0.15);color:#fbbf24;}
.badge-approved{background:rgba(52,211,153,0.15);color:#34d399;}
.badge-rejected{background:rgba(248,113,113,0.15);color:#f87171;}
.genre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.55rem;}
@media(min-width:700px){.genre-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1000px){.genre-grid{grid-template-columns:repeat(6,1fr);}}
.genre-tile{display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:0.7rem 0.85rem;border-radius:12px;text-decoration:none;color:#fff;font-weight:700;font-size:0.88rem;border:1px solid rgba(255,255,255,0.06);}
.genre-tile span{font-size:0.68rem;font-weight:500;opacity:0.75;margin-top:0.2rem;}

.sched-tabs{display:flex;gap:0.3rem;overflow-x:auto;margin-bottom:1rem;scrollbar-width:none;}
.sched-tab{flex:0 0 auto;background:transparent;border:none;color:var(--muted);font-weight:700;font-size:0.85rem;padding:0.5rem 0.9rem;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;}
.sched-tab.active{color:#fff;border-bottom-color:#ec4899;}
.sched-item{display:flex;align-items:center;gap:0.85rem;background:var(--card);border-radius:12px;padding:0.65rem 0.85rem;border:1px solid var(--border);margin-bottom:0.55rem;}
.sched-thumb{flex:0 0 52px;width:52px;height:70px;border-radius:8px;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.sched-info{flex:1;min-width:0;}
.sched-info h4{font-size:0.88rem;font-weight:600;margin-bottom:0.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sched-ep{font-size:0.72rem;background:rgba(255,255,255,0.08);padding:0.2rem 0.5rem;border-radius:6px;color:var(--muted);}
.sched-time{font-size:0.82rem;font-weight:600;color:var(--muted);white-space:nowrap;}
</style></head><body>

<nav class="navbar">
  <a href="index.html" class="logo">AnimeFan</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="anime.html">Anime</a></li>
    <li><a href="schedule.html" class="active">Schedule</a></li>
    <li><a href="genres.html">Genres</a></li>
    <li><a href="request.html">Request</a></li>
  </ul>
</nav>

<div class="page">
  <a href="index.html" class="back-btn">← Back to Home</a>
  <div class="page-header"><h1>Estimated Schedule</h1><p>Weekly airing times</p></div>
  <div class="sched-tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<footer>
  <p style="font-size:0.72rem;margin-bottom:0.5rem;">AnimeFan does not store any files on our server, we only linked to the media which is hosted on 3rd party services.</p>
  <p>© 2026 AnimeFan. Made with ❤️ for anime lovers.</p>
</footer>

<script>
const days=['mon','tue','wed','thu','fri','sat','sun'];
const labels={mon:'MON',tue:'TUE',wed:'WED',thu:'THU',fri:'FRI',sat:'SAT',sun:'SUN'};
const data={
  fri:[
    {e:'🥊',t:"STEEL BALL RUN JoJo's",ep:'EP 1',time:'12:30 PM'},
    {e:'⚡',t:'Pokémon Horizons',ep:'EP 151',time:'03:25 PM'},
    {e:'🔍',t:'Meitantei Conan',ep:'EP 1',time:'05:30 PM'},
    {e:'🟢',t:'Tensura Season 4',ep:'EP 24',time:'07:30 PM'},
    {e:'⚔️',t:'The Elusive Samurai S2',ep:'EP 11',time:'08:00 PM'}
  ],
  mon:[{e:'⚔️',t:'Shadow of the Eternal Blade',ep:'EP 20',time:'06:30 PM'}],
  tue:[{e:'🗡️',t:'Crimson Guild Chronicles',ep:'EP 9',time:'07:00 PM'}],
  wed:[{e:'🌀',t:'Solo Leveling S2',ep:'EP 13',time:'06:00 PM'}],
  thu:[{e:'⚡',t:'One Punch Man S3',ep:'EP 8',time:'08:30 PM'}],
  sat:[{e:'🏰',t:'Frieren Special',ep:'OVA',time:'06:00 PM'}],
  sun:[{e:'🌟',t:'Demon Slayer S4',ep:'EP 6',time:'05:00 PM'}]
};
const tabs=document.getElementById('tabs');
const list=document.getElementById('list');
function render(day){
  tabs.querySelectorAll('.sched-tab').forEach(t=>t.classList.toggle('active',t.dataset.day===day));
  const items=data[day]||[];
  list.innerHTML=items.map(i=>`
    <div class="sched-item">
      <div class="sched-thumb">${i.e}</div>
      <div class="sched-info"><h4>${i.t}</h4><span class="sched-ep">${i.ep}</span></div>
      <div class="sched-time">${i.time}</div>
    </div>`).join('')||'<p style="color:var(--muted)">No shows this day.</p>';
}
days.forEach(d=>{
  const b=document.createElement('button');
  b.className='sched-tab'+(d==='fri'?' active':'');
  b.dataset.day=d; b.textContent=labels[d];
  b.onclick=()=>render(d);
  tabs.appendChild(b);
});
render('fri');
</script></body></html>
