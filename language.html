<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Network — AnimeFan</title>
<style>
:root{--bg:#0a0a0f;--card:#14141c;--elevated:#1a1a24;--border:rgba(255,255,255,0.08);--muted:#a1a1aa;--grad:linear-gradient(135deg,#a855f7,#ec4899);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh;}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:50;}
.logo{font-weight:800;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.page{padding:1.2rem 3%;max-width:1280px;margin:0 auto;}
.back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;}
.back-btn:hover{color:#fff;}
.page-header{margin:1rem 0 1.25rem;}
.page-header h1{font-size:1.45rem;font-weight:800;display:flex;align-items:center;gap:0.55rem;}
.page-header p{color:var(--muted);font-size:0.9rem;margin-top:0.35rem;}
.tabs{display:flex;gap:0.5rem;margin-bottom:1.1rem;flex-wrap:wrap;}
.tab{background:var(--elevated);border:1px solid var(--border);color:var(--muted);padding:0.45rem 1rem;border-radius:50px;font-size:0.85rem;cursor:pointer;font-family:inherit;}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;font-weight:600;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.9rem;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:0.6rem;}}
.anime-card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block;border:1px solid var(--border);transition:transform .15s,border-color .15s;}
.anime-card:hover{transform:translateY(-3px);border-color:rgba(168,85,247,0.4);}
.card-poster{aspect-ratio:2/3;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative;}
.rating-badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,0.75);color:#fbbf24;font-size:0.7rem;padding:0.15rem 0.4rem;border-radius:4px;}
.lang-pill{position:absolute;bottom:7px;left:7px;font-size:0.65rem;font-weight:700;padding:0.12rem 0.4rem;border-radius:4px;background:rgba(168,85,247,0.9);}
.lang-pill.fd{background:rgba(251,146,60,0.95);color:#1a1a1a;}
.card-body{padding:0.55rem 0.6rem 0.7rem;}
.card-body h3{font-size:0.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;}
.pager{display:flex;gap:0.4rem;justify-content:center;margin:1.5rem 0;flex-wrap:wrap;}
.page-btn{background:var(--elevated);border:1px solid var(--border);color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-family:inherit;}
.page-btn.active{background:var(--grad);border-color:transparent;}
.page-btn:disabled{opacity:0.4;cursor:default;}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);grid-column:1/-1;}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.78rem;border-top:1px solid var(--border);margin-top:2rem;}
</style>
</head>
<body>
<nav class="navbar">
  <a class="logo" href="index.html">AnimeFan</a>
  <a class="back-btn" href="index.html">← Home</a>
</nav>
<main class="page">
  <div class="page-header">
    <h1 id="netTitle">Network</h1>
    <p id="netSub">0 titles available</p>
  </div>
  <div class="tabs">
    <button class="tab active" data-sort="popular">Popular</button>
    <button class="tab" data-sort="rated">Top Rated</button>
    <button class="tab" data-sort="newest">Newest</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</main>
<footer>AnimeFan · Network catalog</footer>
<script>
const catalogs = {
  crunchyroll: {
    name: "Crunchyroll",
    items: [
      {t:"Frieren: Beyond Journey's End",r:"9.3",e:"🧙",m:"TV · 28 Eps",lang:"Hindi Sub"},
      {t:"Jujutsu Kaisen S3",r:"9.0",e:"👊",m:"TV · 24 Eps",lang:"Hindi Sub"},
      {t:"Solo Leveling S2",r:"8.7",e:"⚔️",m:"TV · 13 Eps",lang:"Hindi"},
      {t:"Chainsaw Man",r:"8.7",e:"🪚",m:"TV · 12 Eps",lang:"Hindi Sub"},
      {t:"Spy x Family S3",r:"8.6",e:"🕵️",m:"TV · 12 Eps",lang:"Hindi"},
      {t:"Kaiju No. 8",r:"8.7",e:"🦖",m:"TV · 12 Eps",lang:"Hindi Sub"},
      {t:"Blue Lock S2",r:"8.4",e:"⚽",m:"TV · 14 Eps",lang:"Hindi Sub"},
      {t:"Mashle S2",r:"8.1",e:"💪",m:"TV · 12 Eps",lang:"Hindi"}
    ]
  },
  netflix: {
    name: "Netflix",
    items: [
      {t:"Neon Horizon: Zero",r:"9.1",e:"🌃",m:"TV · 12 Eps",lang:"Hindi"},
      {t:"One Piece",r:"9.4",e:"🏴‍☠️",m:"TV · 1000+",lang:"Hindi"},
      {t:"Castlevania",r:"8.8",e:"🧛",m:"TV · 32 Eps",lang:"Hindi Sub"},
      {t:"Cyberpunk Edgerunners",r:"8.6",e:"🤖",m:"TV · 10 Eps",lang:"Hindi Sub"},
      {t:"Devilman Crybaby",r:"8.0",e:"😈",m:"TV · 10 Eps",lang:"Hindi Sub"},
      {t:"Scott Pilgrim Takes Off",r:"8.3",e:"🎸",m:"TV · 8 Eps",lang:"Hindi"},
      {t:"Pluto",r:"8.5",e:"🤖",m:"TV · 8 Eps",lang:"Hindi Sub"},
      {t:"Dota: Dragon's Blood",r:"7.9",e:"🐉",m:"TV · 24 Eps",lang:"Hindi"}
    ]
  },
  prime: {
    name: "Prime Video",
    items: [
      {t:"Crimson Guild Chronicles",r:"9.2",e:"🗡️",m:"TV · 24 Eps",lang:"Hindi Sub"},
      {t:"The Boys Presents: Diabolical",r:"7.8",e:"💥",m:"TV · 8 Eps",lang:"Hindi"},
      {t:"Invincible",r:"8.7",e:"🦸",m:"TV · 16 Eps",lang:"Hindi Sub"},
      {t:"Undone",r:"8.2",e:"🌀",m:"TV · 16 Eps",lang:"Hindi Sub"},
      {t:"Altered Carbon",r:"8.0",e:"🧬",m:"TV · 18 Eps",lang:"Hindi"},
      {t:"Nightfall City",r:"8.4",e:"🌆",m:"TV · 10 Eps",lang:"Hindi Sub"},
      {t:"Sakura Circuit",r:"8.1",e:"🏎️",m:"TV · 12 Eps",lang:"Hindi"}
    ]
  },
  hotstar: {
    name: "Hotstar",
    items: [
      {t:"Cherry Blossom Letters",r:"8.9",e:"🌸",m:"TV · 13 Eps",lang:"Hindi Sub"},
      {t:"Special Ops Universe",r:"8.3",e:"🔫",m:"TV · 10 Eps",lang:"Hindi"},
      {t:"Aarya Origins",r:"8.0",e:"👑",m:"TV · 8 Eps",lang:"Hindi"},
      {t:"Tokyo Debunker",r:"7.9",e:"🏫",m:"TV · 12 Eps",lang:"Hindi Sub"},
      {t:"Star Wars: Visions",r:"8.2",e:"⭐",m:"TV · 18 Eps",lang:"Hindi Sub"},
      {t:"Baymax!",r:"7.7",e:"🏥",m:"TV · 6 Eps",lang:"Hindi"}
    ]
  },
  telegram: {
    name: "Telegram",
    items: [
      {t:"Demon Slayer S4",r:"9.0",e:"🌟",m:"TV · 11 Eps",lang:"FanDub"},
      {t:"Crimson Guild Chronicles",r:"9.2",e:"🗡️",m:"TV · 24 Eps",lang:"FanDub"},
      {t:"Jujutsu Kaisen S3",r:"9.0",e:"👊",m:"TV · 24 Eps",lang:"FanDub"},
      {t:"Solo Leveling S2",r:"8.7",e:"⚔️",m:"TV · 13 Eps",lang:"FanDub"},
      {t:"Blue Lock S2",r:"8.4",e:"⚽",m:"TV · 14 Eps",lang:"FanDub"},
      {t:"Kaiju No. 8",r:"8.7",e:"🦖",m:"TV · 12 Eps",lang:"FanDub"},
      {t:"One Punch Man S3",r:"8.8",e:"💪",m:"TV · 12 Eps",lang:"FanDub"},
      {t:"Spy x Family S3",r:"8.6",e:"🕵️",m:"TV · 12 Eps",lang:"FanDub"}
    ]
  }
};

const params = new URLSearchParams(location.search);
let key = (params.get("network") || params.get("lang") || "netflix").toLowerCase();
if (key === "fandub") key = "telegram";
if (key === "hindi" || key === "hsub") key = "crunchyroll";
if (!catalogs[key]) key = "netflix";

const cat = catalogs[key];
let list = [...cat.items];
document.getElementById("netTitle").textContent = cat.name;
document.title = cat.name + " — AnimeFan";
document.getElementById("netSub").textContent = list.length + " anime available";

const PER = 12;
let page = 1, sort = "popular";

function sorted() {
  let a = [...list];
  if (sort === "rated") a.sort((x,y) => parseFloat(y.r) - parseFloat(x.r));
  if (sort === "newest") a = a.slice().reverse();
  return a;
}

function render() {
  const grid = document.getElementById("grid");
  const pager = document.getElementById("pager");
  const arr = sorted();
  if (!arr.length) {
    grid.innerHTML = `<div class="empty-state"><h3>No Anime</h3><p>Is network pe abhi cards nahi hain.</p></div>`;
    pager.innerHTML = "";
    return;
  }
  const pages = Math.ceil(arr.length / PER) || 1;
  if (page > pages) page = pages;
  const slice = arr.slice((page - 1) * PER, page * PER);
  grid.innerHTML = slice.map(a => {
    const fd = (a.lang || "").toLowerCase().includes("fan");
    return `<a class="anime-card" href="anime-detail.html">
      <div class="card-poster">
        <span class="rating-badge">★ ${a.r}</span>
        <span class="lang-pill ${fd ? "fd" : ""}">${a.lang || ""}</span>
        ${a.e}
      </div>
      <div class="card-body">
        <h3>${a.t}</h3>
        <div class="card-meta">${a.m}</div>
      </div>
    </a>`;
  }).join("");
  if (pages <= 1) { pager.innerHTML = ""; return; }
  let h = `<button class="page-btn" ${page===1?"disabled":""} data-p="${page-1}">‹</button>`;
  for (let i = 1; i <= pages; i++) h += `<button class="page-btn ${i===page?"active":""}" data-p="${i}">${i}</button>`;
  h += `<button class="page-btn" ${page===pages?"disabled":""} data-p="${page+1}">›</button>`;
  pager.innerHTML = h;
  pager.querySelectorAll(".page-btn").forEach(b => b.onclick = () => {
    const p = +b.dataset.p;
    if (p >= 1) { page = p; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  });
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  sort = t.dataset.sort;
  page = 1;
  render();
});
render();
</script>
</body>
</html>
