<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Browse by Language — AnimeFan</title>
<style>
:root{--bg:#0a0a0f;--card:#14141c;--elevated:#1a1a24;--border:rgba(255,255,255,0.08);--accent:#a855f7;--accent2:#ec4899;--muted:#a1a1aa;--grad:linear-gradient(135deg,#a855f7,#ec4899);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh;}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:50;}
.logo{font-weight:800;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.nav-links{display:flex;gap:1.2rem;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;}
.nav-links a:hover{color:#fff;}
@media(max-width:700px){.nav-links{display:none;}}
.page{padding:1.2rem 1.2%;max-width:1400px;margin:0 auto;}
.back-btn{color:var(--muted);text-decoration:none;font-size:0.9rem;display:inline-block;margin-bottom:1rem;}
.back-btn:hover{color:var(--accent);}
.page-header{margin-bottom:1.2rem;}
.page-header h1{font-size:1.6rem;font-weight:800;margin-bottom:0.25rem;}
.page-header p{color:var(--muted);font-size:0.9rem;}
.tabs{display:flex;gap:0.5rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.tab{background:var(--elevated);border:1px solid var(--border);color:var(--muted);padding:0.45rem 1rem;border-radius:50px;font-size:0.85rem;cursor:pointer;font-family:inherit;}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;font-weight:600;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.85rem;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:0.55rem;}}
.anime-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid transparent;cursor:pointer;transition:0.2s;text-decoration:none;color:inherit;display:block;}
.anime-card:hover{transform:translateY(-4px);border-color:rgba(168,85,247,0.4);}
.card-poster{width:100%;aspect-ratio:2/3;background:linear-gradient(145deg,#1e1e2e,#2a1a3a);position:relative;display:flex;align-items:center;justify-content:center;font-size:2.2rem;}
.rating-badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,0.7);color:#fbbf24;font-size:0.7rem;font-weight:600;padding:0.15rem 0.4rem;border-radius:4px;}
.card-body{padding:0.55rem;}
.card-body h3{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.2rem;}
.card-meta{font-size:0.7rem;color:var(--muted);}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.78rem;border-top:1px solid var(--border);margin-top:2rem;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">AnimeFan</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="trending.html">Trending</a></li>
    <li><a href="schedule.html">Schedule</a></li>
    <li><a href="genres.html">Genres</a></li>
  </ul>
</nav>
<div class="page">
  <a href="index.html" class="back-btn">← Back to Home</a>
  <div class="page-header">
    <h1 id="langTitle">Hindi</h1>
    <p id="langSub">0 titles available</p>
  </div>
  <div class="tabs">
    <button class="tab active" data-sort="popular">Popular</button>
    <button class="tab" data-sort="newest">Newest</button>
    <button class="tab" data-sort="rated">Top Rated</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<footer>
  <p style="font-size:0.72rem;margin-bottom:0.5rem;">AnimeFan does not store any files on our server, we only linked to the media which is hosted on 3rd party services.</p>
  <p>© 2026 AnimeFan. Made with ❤️ for anime lovers.</p>
</footer>
<script>
const data = {
  Hindi: [
    {t:"Neon Horizon: Zero",r:"9.1",e:"🌌",m:"TV · 24 Eps · Hindi"},
    {t:"Solo Leveling S2",r:"8.7",e:"🌀",m:"TV · 13 Eps · Hindi"},
    {t:"Spy x Family S3",r:"8.6",e:"🕵️",m:"TV · 12 Eps · Hindi"},
    {t:"Naruto Shippuden",r:"9.3",e:"🍥",m:"TV · 500 Eps · Hindi"},
    {t:"One Piece",r:"9.2",e:"🏴‍☠️",m:"TV · 1100 Eps · Hindi"},
    {t:"Dragon Ball Super",r:"8.5",e:"🐉",m:"TV · 131 Eps · Hindi"}
  ],
  HSub: [
    {t:"Shadow of the Eternal Blade",r:"9.4",e:"⚔️",m:"TV · 24 Eps · HSub"},
    {t:"Cherry Blossom Letters",r:"8.9",e:"💖",m:"TV · 12 Eps · HSub"},
    {t:"Jujutsu Kaisen S3",r:"9.0",e:"🔥",m:"TV · 24 Eps · HSub"},
    {t:"Frieren",r:"9.3",e:"🏰",m:"TV · 28 Eps · HSub"},
    {t:"Attack on Titan",r:"9.5",e:"⚔️",m:"TV · 87 Eps · HSub"},
    {t:"One Punch Man S3",r:"8.8",e:"⚡",m:"TV · 12 Eps · HSub"}
  ],
  FanDub: [
    {t:"Crimson Guild Chronicles",r:"9.2",e:"🗡️",m:"TV · 24 Eps · FanDub"},
    {t:"Demon Slayer S4",r:"9.0",e:"🌟",m:"TV · 11 Eps · FanDub"},
    {t:"Blue Lock S2",r:"8.4",e:"⚽",m:"TV · 12 Eps · FanDub"},
    {t:"Kaiju No. 8",r:"8.7",e:"🦖",m:"TV · 12 Eps · FanDub"}
  ]
};
const labels = {Hindi:"Hindi", HSub:"Hindi Sub", FanDub:"FanDub"};
const params = new URLSearchParams(location.search);
let lang = params.get("lang") || "Hindi";
if (!data[lang]) lang = "Hindi";
document.getElementById("langTitle").textContent = labels[lang] || lang;
const list = data[lang];
document.getElementById("langSub").textContent = list.length + " titles available";
function render(sort) {
  let arr = [...list];
  if (sort === "rated") arr.sort((a,b)=>parseFloat(b.r)-parseFloat(a.r));
  if (sort === "newest") arr = arr.slice().reverse();
  document.getElementById("grid").innerHTML = arr.map(a => `
    <a class="anime-card" href="anime-detail.html">
      <div class="card-poster"><span class="rating-badge">★ ${a.r}</span>${a.e}</div>
      <div class="card-body"><h3>${a.t}</h3><div class="card-meta">${a.m}</div></div>
    </a>`).join("");
}
render("popular");
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  render(t.dataset.sort);
}));
</script>
</body>
</html>
