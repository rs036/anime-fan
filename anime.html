<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Browse Anime — AnimeFan</title>
<style>
:root{
  --bg:#08080c; --card:#12121a; --border:rgba(255,255,255,0.08);
  --accent:#a855f7; --accent2:#ec4899; --muted:#a1a1aa;
  --grad:linear-gradient(135deg,#8b5cf6,#ec4899);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh;}
a{color:inherit;}

.navbar.scrolled{
  background:rgba(7,9,14,0.55) !important;
  backdrop-filter:blur(12px) !important;
}
.navbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0.75rem 4%;
  background:transparent;
  backdrop-filter:none;
  transition:background 0.25s,backdrop-filter 0.25s;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.logo{font-weight:800;font-size:1.3rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.nav-links{display:flex;gap:1.35rem;list-style:none;align-items:center;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.92rem;font-weight:500;transition:0.2s;}
.nav-links a:hover,.nav-links a.active{color:#fff;}
.nav-right{display:flex;align-items:center;gap:0.5rem;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.06);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:rgba(255,255,255,0.12);}
.filters-nav-btn{
  display:inline-flex;align-items:center;gap:0.35rem;
  height:38px;padding:0 0.85rem;border-radius:999px;
  border:1px solid rgba(168,85,247,0.4);
  background:rgba(139,92,246,0.12);
  color:#e9d5ff;font-weight:600;font-size:0.82rem;
  cursor:pointer;font-family:inherit;transition:0.2s;
}
.filters-nav-btn:hover,.filters-nav-btn.open{
  background:rgba(139,92,246,0.28);
  border-color:rgba(168,85,247,0.65);
  color:#fff;
}
.profile-btn{
  width:38px;height:38px;border-radius:50%;border:2px solid rgba(168,85,247,0.5);
  background:linear-gradient(135deg,#7c3aed,#ec4899);cursor:pointer;
}

.nav-actions{
  display:flex;align-items:center;gap:14px;
  padding:0;background:transparent;border:none;
}
.nav-actions .icon-btn{
  width:26px;height:26px;border:none;background:transparent;padding:0;
}
.nav-actions .icon-btn:hover{background:transparent;opacity:0.85;}
.nav-actions .profile-btn{
  width:27px;height:27px;border-radius:50%;
  border:none;overflow:hidden;padding:0;display:block;
  background:#1a1a24;
  box-shadow:0 0 0 2px #000, 0 0 0 4px #ef4444;
}
.nav-actions .profile-btn img{width:100%;height:100%;object-fit:cover;display:block;}

.menu-btn{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;}
@media(max-width:800px){
  .nav-links{display:none;}
  .menu-btn{display:block;}
}

/* Search overlay — home style */
.search-overlay{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;
  background:rgba(0,0,0,0);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity 0.28s,visibility 0.28s,background 0.28s;
}
.search-overlay.open{
  opacity:1;visibility:visible;pointer-events:auto;
  background:rgba(5,5,10,0.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.search-overlay-panel{
  width:100%;max-width:640px;margin:0 auto;
  padding:1.4rem 1.25rem 1.5rem;
  transform:translateY(-24px) scale(0.96);opacity:0;
  transition:transform 0.3s cubic-bezier(0.22,1,0.36,1),opacity 0.3s;
}
.search-overlay.open .search-overlay-panel{
  transform:translateY(0) scale(1);opacity:1;
}
.search-overlay-bar{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(30,30,42,0.95),rgba(18,18,28,0.98));
  border:1px solid rgba(168,85,247,0.35);
  border-radius:16px;
  padding:0.85rem 1.1rem;
  box-shadow:0 12px 40px rgba(0,0,0,0.45),0 0 0 1px rgba(168,85,247,0.1);
}
.search-overlay-bar input{
  flex:1;background:transparent;border:none;color:#fff;
  font-size:1.05rem;outline:none;font-family:inherit;min-width:0;
}
.search-overlay-bar input::placeholder{color:#71717a;}
.search-results{margin-top:1rem;max-height:55vh;overflow-y:auto;}
.search-hit{
  display:flex;align-items:center;gap:14px;
  padding:0.7rem 0.85rem;border-radius:12px;
  text-decoration:none;color:#fff;
  background:rgba(255,255,255,0.03);
  border:1px solid transparent;
  margin-bottom:0.4rem;transition:0.2s;
}
.search-hit:hover{background:rgba(168,85,247,0.12);border-color:rgba(168,85,247,0.3);}
.search-hit-thumb{
  width:42px;height:56px;border-radius:8px;
  background:linear-gradient(145deg,#1e1e2e,#2a1a3a);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.search-hit-info strong{display:block;font-size:0.9rem;}
.search-hit-info span{font-size:0.75rem;color:var(--muted);}

.page{padding:1.4rem 0 3rem;max-width:none;margin:0 auto;}
.page-header,.tools-row,.results-meta,.filter-panel,.pager{
  padding-left:4%;padding-right:4%;max-width:1400px;margin-left:auto;margin-right:auto;box-sizing:border-box;
}
.page-header{max-width:none;}
.tools-row{max-width:none;}
.results-meta{max-width:none;}
.filter-panel{max-width:none;margin-left:4%;margin-right:4%;width:auto;}
.grid{
  padding-left:0.5rem;padding-right:0.5rem;
  max-width:none;
  width:100%;
}
.page-header{margin-bottom:1.15rem;padding-left:4%;padding-right:4%;}
.page-header h1{font-size:clamp(1.5rem,3vw,1.9rem);font-weight:800;letter-spacing:-0.02em;}
.page-header p{color:var(--muted);font-size:0.9rem;margin-top:0.3rem;}

.tools-row{
  display:flex; align-items:center; gap:0.65rem;
  margin-bottom:1.1rem;
}
.search-inline{
  flex:1;
  display:flex; align-items:center; gap:0.65rem;
  padding:0.65rem 1rem;
  border-radius:12px;
  background:rgba(18,18,28,0.9);
  border:1px solid rgba(255,255,255,0.1);
  transition:border-color 0.2s, background 0.2s;
  min-width:0;
}
.search-inline:focus-within{
  border-color:rgba(168,85,247,0.5);
  background:rgba(24,24,36,0.95);
}
.search-inline svg{ flex-shrink:0; color:#a855f7; }
.search-inline input{
  flex:1; min-width:0;
  background:transparent; border:none; outline:none;
  color:#fff; font-size:0.92rem; font-family:inherit;
}
.search-inline input::placeholder{ color:#71717a; }
.filters-btn{
  display:inline-flex; align-items:center; gap:0.4rem;
  padding:0.75rem 1.1rem;
  border-radius:12px;
  background:rgba(139,92,246,0.15);
  border:1px solid rgba(168,85,247,0.4);
  color:#e9d5ff;
  font-weight:600; font-size:0.88rem;
  cursor:pointer; font-family:inherit;
  transition:0.2s; white-space:nowrap;
}
.filters-btn:hover, .filters-btn.open{
  background:rgba(139,92,246,0.28);
  border-color:rgba(168,85,247,0.65);
  color:#fff;
}
@media(max-width:800px){
  .page{ padding:1.1rem 4% 2.5rem; }
  .page-header h1{ font-size:1.45rem; }
  /* same as desktop: search + filters in one row under title */
  .tools-row{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:0.5rem;
    margin-bottom:1rem;
  }
  .search-inline{
    flex:1;
    min-width:0;
    padding:0.7rem 0.85rem;
    font-size:0.88rem;
  }
  .filters-btn{
    flex-shrink:0;
    padding:0.7rem 0.9rem;
    font-size:0.84rem;
  }
  .filter-panel{
    padding:1rem;
    border-radius:16px;
  }
  .search-overlay-panel{
    padding:1rem 0.85rem 1.25rem;
    max-width:100%;
  }
  .search-overlay-bar{
    padding:0.75rem 0.9rem;
    border-radius:14px;
  }
  .search-overlay-bar input{ font-size:1rem; }
}
@media(max-width:480px){
  .tools-row{
    flex-direction:row; /* keep side by side like desktop */
    align-items:center;
  }
  .filters-btn{
    padding:0.7rem 0.75rem;
  }
}


.filter-panel{
  background:linear-gradient(145deg,rgba(30,28,55,0.95),rgba(18,18,32,0.98));
  border:1px solid rgba(139,92,246,0.18);
  border-radius:20px;
  padding:1.15rem 1.25rem 1.25rem;
  margin-bottom:1.35rem;
  box-shadow:0 12px 40px rgba(0,0,0,0.35);
  animation:filterIn 0.25s ease;
}
.filter-panel[hidden]{display:none !important;}
@keyframes filterIn{
  from{opacity:0;transform:translateY(-6px);}
  to{opacity:1;transform:none;}
}
.filter-row{margin-bottom:0.95rem;}
.filter-row:last-child{margin-bottom:0;}
.filter-label{display:block;font-size:0.78rem;font-weight:600;color:#9ca3af;margin-bottom:0.45rem;}
.chip-row{
  display:flex;
  flex-wrap:nowrap;
  gap:0.45rem;
  align-items:center;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:2px;
}
.chip-row::-webkit-scrollbar{ display:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex-shrink:0;
  padding:0.38rem 0.9rem;border-radius:999px;font-size:0.82rem;font-weight:600;
  border:1px solid rgba(255,255,255,0.12);background:rgba(15,15,25,0.7);
  color:#d4d4d8;cursor:pointer;transition:0.2s;font-family:inherit;
}
.chip:hover{border-color:rgba(168,85,247,0.45);color:#fff;}
.chip.active{
  background:rgba(139,92,246,0.25);
  border-color:rgba(168,85,247,0.65);
  color:#fff;
}
.fields-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:0.75rem 1rem;
}
@media(max-width:900px){
  .fields-grid{
    grid-template-columns:1fr 1fr;
  }
}
.field label{display:block;font-size:0.78rem;font-weight:600;color:#9ca3af;margin-bottom:0.4rem;}
.field select{
  width:100%;padding:0.65rem 0.9rem;border-radius:12px;
  background:rgba(10,10,18,0.85);border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:0.88rem;font-family:inherit;outline:none;
}
.field select:focus{border-color:rgba(168,85,247,0.55);}
.field select option{background:#12121a;}

.results-meta{color:var(--muted);font-size:0.82rem;margin-bottom:1rem;}
.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0.65rem;width:100%;}
@media(max-width:1100px) and (min-width:701px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:0.6rem;}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0.55rem;padding-left:0.4rem;padding-right:0.4rem;}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:0.65rem;}}

.anime-card{
  background:var(--card);border-radius:14px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.05);cursor:pointer;
  transition:transform 0.3s,box-shadow 0.3s,border-color 0.3s;
  text-decoration:none;color:inherit;display:block;
}
.anime-card:hover{
  transform:translateY(-6px) scale(1.02);
  border-color:rgba(139,92,246,0.45);
  box-shadow:0 16px 40px rgba(0,0,0,0.45),0 0 24px rgba(139,92,246,0.2);
}
.card-poster{
  width:100%;aspect-ratio:2/3;
  background:linear-gradient(145deg,#1e1e2e,#2a1a3a);
  position:relative;display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;overflow:hidden;
}
.rating-badge{
  position:absolute;top:7px;right:7px;z-index:2;
  background:rgba(0,0,0,0.75);color:#fbbf24;
  font-size:0.7rem;font-weight:700;padding:0.15rem 0.4rem;border-radius:6px;
}
.card-lang{
  position:absolute;bottom:8px;right:8px;z-index:2;
  color:#fff;font-size:0.65rem;font-weight:700;
  padding:0.22rem 0.55rem;border-radius:6px;
}
.card-lang.lang-hindi{background:linear-gradient(135deg,#7c3aed,#8b5cf6);}
.card-lang.lang-hsub{background:linear-gradient(135deg,#d97706,#f59e0b);}
.card-lang.lang-fandub{background:linear-gradient(135deg,#db2777,#ec4899);}
.card-lang.lang-dual{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,8,16,0.92),rgba(0,0,0,0.2));
  opacity:0;transition:opacity 0.2s;display:flex;align-items:center;justify-content:center;z-index:3;
  pointer-events:none;
}
.card-play{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  display:flex;align-items:center;justify-content:center;
  transform:scale(0.75);opacity:0;transition:0.2s;
  box-shadow:0 0 28px rgba(139,92,246,0.5);
}
.card-play svg{width:22px;height:22px;fill:#fff;margin-left:3px;}
.anime-card:hover .card-overlay,.anime-card.show-play .card-overlay{opacity:1;}
.anime-card:hover .card-play,.anime-card.show-play .card-play{transform:scale(1);opacity:1;}
.card-body{padding:0.6rem 0.65rem 0.75rem;}
.card-body h3{font-size:0.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.2rem;}
.card-meta{font-size:0.7rem;color:var(--muted);}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);grid-column:1/-1;}
.empty h3{color:#fff;margin-bottom:0.4rem;}
.pager{display:flex;justify-content:center;gap:0.4rem;margin-top:1.75rem;flex-wrap:wrap;}
.page-btn{
  min-width:38px;height:38px;padding:0 0.7rem;border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);
  color:#fff;font-weight:600;cursor:pointer;font-family:inherit;
}
.page-btn.active{background:var(--grad);border-color:transparent;}
.page-btn:disabled{opacity:0.35;cursor:default;}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.8rem;border-top:1px solid var(--border);margin-top:2rem;}
</style>
</head>

function langLabel(langs){
  if(!langs||!langs.length) return {text:'', cls:''};
  if(langs.length>=2) return {text:'Dual', cls:'lang-dual'};
  const l=langs[0];
  if(l==='Hindi') return {text:'Hindi', cls:'lang-hindi'};
  if(l==='Hindi Sub') return {text:'Hindi Sub', cls:'lang-hsub'};
  if(l==='FanDub') return {text:'FanDub', cls:'lang-fandub'};
  return {text:l, cls:'lang-dual'};
}

let lang='all', genre='all', page=1, searchQ='';
const PER=36;
const params=new URLSearchParams(location.search);
if(params.get('q')) searchQ=params.get('q');

function getFiltered(){
  const type=document.getElementById('typeSelect').value;
  const status=document.getElementById('statusSelect').value;
  const year=document.getElementById('yearSelect').value;
  const sort=document.getElementById('sortSelect').value;
  let arr=list.slice();
  const q=searchQ.toLowerCase().trim();
  if(q) arr=arr.filter(x=>x.t.toLowerCase().includes(q)||(x.genres||[]).some(g=>g.toLowerCase().includes(q)));
  if(lang!=='all') arr=arr.filter(x=>(x.langs||[]).includes(lang));
  if(genre!=='all') arr=arr.filter(x=>(x.genres||[]).includes(genre));
  if(type!=='all') arr=arr.filter(x=>x.type===type);
  if(status!=='all') arr=arr.filter(x=>x.status===status);
  if(year==='2026'||year==='2025'||year==='2023') arr=arr.filter(x=>String(x.year)===year);
  else if(year==='older') arr=arr.filter(x=>x.year<=2022);
  if(sort==='popular') arr.sort((a,b)=>b.pop-a.pop);
  else if(sort==='rating') arr.sort((a,b)=>b.r-a.r);
  else if(sort==='title') arr.sort((a,b)=>a.t.localeCompare(b.t));
  else if(sort==='new') arr.sort((a,b)=>b.year-a.year);
  return arr;
}

function render(){
  const arr=getFiltered();
  const pages=Math.max(1,Math.ceil(arr.length/PER));
  if(page>pages) page=pages;
  const slice=arr.slice((page-1)*PER, page*PER);
  document.getElementById('totalCount').textContent=list.length;
  document.getElementById('resultsMeta').textContent=
    arr.length? `${arr.length} shown · Page ${page}/${pages}` : 'No anime found';
  const grid=document.getElementById('grid');
  if(!slice.length){
    grid.innerHTML='<div class="empty"><h3>No Anime Found</h3><p>Search ya filters change karke try karo.</p></div>';
    document.getElementById('pager').innerHTML='';
    return;
  }
  grid.innerHTML=slice.map(a=>{
    const L=langLabel(a.langs);
    return `<a class="anime-card" href="anime-detail.html">
      <div class="card-poster">
        <span class="rating-badge">★ ${a.r.toFixed(1)}</span>
        ${a.e}
        ${L.text?`<span class="card-lang ${L.cls}">${L.text}</span>`:''}
        <div class="card-overlay"><div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
      </div>
      <div class="card-body">
        <h3>${a.t}</h3>
        <div class="card-meta">${a.type} · ${a.eps}</div>
      </div>
    </a>`;
  }).join('');
  const pager=document.getElementById('pager');
  if(pages<=1){ pager.innerHTML=''; return; }
  let h=`<button class="page-btn" ${page===1?'disabled':''} data-p="${page-1}">‹</button>`;
  for(let i=1;i<=pages;i++) h+=`<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;
  h+=`<button class="page-btn" ${page===pages?'disabled':''} data-p="${page+1}">›</button>`;
  pager.innerHTML=h;
  pager.querySelectorAll('.page-btn').forEach(b=>{
    b.onclick=()=>{const p=+b.dataset.p;if(p>=1&&p<=pages){page=p;render();

  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
})();window.scrollTo({top:0,behavior:'smooth'});}};

}

function bindChips(sel, key){

      btn.classList.add('active');
      if(key==='lang') lang=btn.dataset.lang;
      else genre=btn.dataset.genre;
      page=1; render();
